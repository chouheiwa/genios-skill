name: Release genios skill

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

defaults:
  run:
    working-directory: genios

jobs:
  build:
    name: Package ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            goos: darwin
            goarch: arm64
          - name: darwin-amd64
            goos: darwin
            goarch: amd64
          - name: linux-arm64
            goos: linux
            goarch: arm64
          - name: linux-amd64
            goos: linux
            goarch: amd64
          - name: windows-amd64
            goos: windows
            goarch: amd64
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: genios/go.mod
          cache-dependency-path: genios/go.mod

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist/stage/bin
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi
          go build -trimpath -ldflags='-s -w' -o "dist/stage/bin/genios${suffix}" ./cmd/genios

      - name: Assemble skill package
        env:
          TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.name }}
        run: |
          # The archive extracts directly into .agents/skills/genios.
          cp SKILL.md README.md project.example.md dist/stage/
          cp -R references dist/stage/references
          cp -R evals dist/stage/evals
          archive="genios-skill-${TAG}-${PLATFORM}.tar.gz"
          stable_archive="genios-skill-${PLATFORM}.tar.gz"
          suffix=""
          if [ "$PLATFORM" = "windows-amd64" ]; then suffix=".exe"; fi
          tar -C dist/stage -czf "$archive" .
          cp "$archive" "$stable_archive"
          tar -tzf "$archive" | grep -qx './SKILL.md'
          tar -tzf "$archive" | grep -qx "./bin/genios${suffix}"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
        id: package

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: genios-skill-${{ github.ref_name }}-${{ matrix.name }}
          path: |
            genios/genios-skill-${{ github.ref_name }}-${{ matrix.name }}.tar.gz
            genios/genios-skill-${{ matrix.name }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: genios-skill-${{ github.ref_name }}-*
          path: release-assets
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/* \
            --title "GeniOS skill $TAG" \
            --generate-notes
